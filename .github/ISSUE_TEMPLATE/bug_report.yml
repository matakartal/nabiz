name: Bug report
description: Something in Nabız doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Please update to the latest release first — many problems are already fixed.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I'm on the latest release (the panel's Update button, or Settings → About).
          required: true
        - label: I searched open and closed issues and this isn't one of them.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Panel or menu bar
        - Suggestions and fixes
        - Developer tools (ports, projects, Docker, simulators, clean-up)
        - AI chat or AI limits
        - MCP
        - Launcher or clipboard
        - Screenshots or recordings
        - Notes, focus, timers, weather or other tools
        - Settings
        - Install or update
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. A screenshot or a short recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open the panel
        2. …
  - type: input
    id: version
    attributes:
      label: Nabız version
      description: Settings → About.
      placeholder: 1.10.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Pro M4
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A crash report (Settings → About → Send crash report), logs, or what changed recently. Remove anything private first.
