name: Build

# Run by hand only (Actions → Build → Run workflow): private-repo macOS minutes are paid, and without them every
# automatic run fails before starting and sends an email. release.sh runs the same tests locally before each release.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && swift --version
      - name: Run the tests
        run: swift test
      - name: Build the universal app and DMG
        run: ./build.sh dmg
      - name: Check the calculator
        run: |
          test "$(build/Nabiz.app/Contents/MacOS/Nabiz --calc '12*4')" = "= 48"
          test "$(build/Nabiz.app/Contents/MacOS/Nabiz --calc '5 km mi')" != "—"
      - uses: actions/upload-artifact@v4
        with:
          name: Nabiz-dmg
          path: build/Nabiz-*.dmg
