name: Build

# By hand (Actions → Build → Run workflow): a universal DMG as a download, for testing a branch. Pull requests and
# main are checked by ci.yml; releases are built, signed and notarized locally by release.sh.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && swift --version
      - name: Run the tests
        run: swift test
      - name: Build the universal app and DMG
        run: ./build.sh dmg
      - name: Check the calculator
        run: |
          test "$(build/Nabiz.app/Contents/MacOS/Nabiz --calc '12*4')" = "= 48"
          test "$(build/Nabiz.app/Contents/MacOS/Nabiz --calc '5 km mi')" != "—"
      - uses: actions/upload-artifact@v4
        with:
          name: Nabiz-dmg
          path: build/Nabiz-*.dmg
